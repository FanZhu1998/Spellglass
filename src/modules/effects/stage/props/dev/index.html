<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shelf of props</title>
  <!-- Dev harness for the props half of the stage (not part of the app build). Serve with
       npx vite --port 5182 --strictPort and open /src/modules/effects/stage/props/dev/index.html.
       ?shot=1 hides the controls; ?room=bright tries a lit room; ?caster=4:3 a different camera;
       ?reduced=1 starts with reduced motion. dev/shoot.ts takes stills, crops and film strips of it;
       dev/core-shots.ts drives the real stage core's harness with the same shelf. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0f1424; color: #e9dfc7; font: 14px/1.4 Georgia, serif; overflow: hidden; }
    #mirror { position: absolute; top: 56px; left: 24px; right: 24px; bottom: 112px; background: #06080f; border-radius: 6px;
      box-shadow: 0 0 0 2px #2b2118, 0 0 0 6px #5a4322, 0 0 0 8px #2b2118; overflow: hidden; touch-action: none; }
    body.shot #mirror { bottom: 72px; }
    #mirror canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #light { mix-blend-mode: screen; }
    #title { position: absolute; top: 14px; left: 28px; font-size: 22px; letter-spacing: 0.02em; }
    #controls { position: absolute; left: 0; right: 0; bottom: 0; height: 104px; display: flex; flex-wrap: wrap; align-content: flex-start;
      gap: 4px; padding: 6px 12px; box-sizing: border-box; background: #232a3b; overflow: auto; }
    body.shot #controls { display: none; }
    #controls b { width: 100%; height: 0; }
    button { font: 12px Georgia, serif; background: #7b1e2b; color: #e9dfc7; border: 0; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
    button.alt { background: #3a4357; }
    #readout { position: absolute; top: 16px; right: 28px; font-size: 12px; color: #9a9db0; }
  </style>
</head>
<body>
  <div id="title">Spellglass</div>
  <div id="readout"></div>
  <div id="mirror"><canvas id="room"></canvas><canvas id="shade"></canvas><canvas id="light"></canvas></div>
  <div id="controls"></div>
  <script type="module" src="./harness.ts"></script>
</body>
</html>
