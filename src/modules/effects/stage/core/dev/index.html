<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The app's own policy, so the harness catches anything the stage would trip over. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; font-src 'self' data:; connect-src 'self' data: blob: ws:; object-src 'none'; base-uri 'self'"
    />
    <title>Stage harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1424; color: #e9dfc7; font-family: Georgia, serif; }
      #frame {
        position: absolute; left: 24px; top: 24px; width: 1280px; height: 720px; padding: 14px; border-radius: 18px;
        background: linear-gradient(160deg, #6e5631 0%, #3a2a16 22%, #8c6b3b 48%, #2f2213 72%, #5c4524 100%);
      }
      #glass {
        position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 9px;
        background: radial-gradient(120% 90% at 50% 35%, #1c2236 0%, #0c1020 70%, #070a14 100%);
      }
      #mirror { position: absolute; inset: 0; touch-action: none; }
      #clip { position: absolute; left: 24px; top: 800px; width: 640px; height: 360px; background: #000; }
    </style>
  </head>
  <body>
    <div id="frame"><div id="glass"><div id="mirror"></div></div></div>
    <video id="clip" muted playsinline></video>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
